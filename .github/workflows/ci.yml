name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .

      - name: Check the shell installer parses
        if: runner.os != 'Windows'
        run: bash -n install.sh

      - name: Check the PowerShell installer parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { $_.Message }; exit 1 }
          Write-Host "install.ps1 parses cleanly"

      - name: "End-to-end suite: clean install, capture/query flows, uninstall"
        # Clones this checkout via the real install.sh/install.ps1, drives
        # the actually-installed binary through both halves (ledger and
        # notes) with real value assertions, then uninstalls and checks
        # nothing was left on PATH and nothing recorded was touched. Fully
        # isolated in its own temp HOME -- see scripts/e2e_test.py.
        run: uv run python scripts/e2e_test.py
