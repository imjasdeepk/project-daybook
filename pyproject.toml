[project]
name = "project-daybook"
version = "0.1.0"
description = "A daybook you talk to: a diary and knowledge base, plus a ledger of loans, interest and dates. Answers are retrieved or computed, never recalled."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
    "beancount>=3.0.0",
    "beanquery>=0.1.0",
    "fava>=1.27",
    "icalendar>=6.0.0",
    "recurring-ical-events>=3.0.0",
]

[project.scripts]
daybook = "daybook_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daybook_tools"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines happen in prose-heavy docstrings; not worth failing CI over
